set -g prefix C-Space
set-option -g default-terminal "tmux-256color"

set -s escape-time 10

# Forward C-hjkl into panes that run their own split navigation instead of
# consuming the key here. herdr is in this list because it repeats the same
# handoff one level down: see nvim/.config/herdr/bin/herdr-nav, which forwards
# to neovim or moves herdr's own pane focus. Without herdr here, tmux answers
# with select-pane, which is a silent no-op in a single-pane window.
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)(g?(view|n?vim?)(diff)?|herdr)$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

set-window-option -g mode-keys vi
setw -g mode-keys vi
set -g status-keys vi

# Uncomment this if using zshell
# set-option -g default-shell /bin/zsh
