onboarding = false

[keys]
# Prefix: tmux owns ctrl+space (see tmux/.tmux.conf), so herdr takes ctrl+a
# for nested use. Press prefix twice to send a literal ctrl+a to the pane.
prefix = "ctrl+a"

# Actions below mirror tmux defaults. Herdr defaults that already match tmux
# (next/previous_tab prefix+n/p, close_pane prefix+x, zoom prefix+z,
# help prefix+?, focus_pane_* prefix+hjkl) are left unset.

detach = "prefix+d"
copy_mode = "prefix+["
last_pane = "prefix+;"

split_vertical = "prefix+%"
split_horizontal = "prefix+\""

rename_tab = "prefix+,"

# Tabs are 0-indexed via the custom commands below. switch_tab, new_tab and
# close_tab are unbound so they cannot fight those bindings — herdr hard-codes
# switch_tab to 1..9 ("indexed keybinding must use 1..9") and labels new tabs
# with their 1-based number, so both are replaced by bin/herdr-tab.
switch_tab = ""
new_tab = ""
close_tab = ""

# Herdr workspaces map onto tmux sessions.
rename_workspace = "prefix+$"
workspace_picker = "prefix+s"
settings = "prefix+shift+s"

# Navigate mode (prefix+w): vi motions instead of arrow keys. Workspace
# up/down claim j/k, which disables navigate_pane_up/down — herdr resolves the
# collision in favor of whichever is declared here. Pane left/right keep h/l.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_right = "l"

swap_pane_left = "prefix+{"
swap_pane_right = "prefix+}"

# --- vim-aware pane navigation ------------------------------------------
# Bare ctrl+hjkl moves pane focus, except when the pane runs vim or neovim, in
# which case bin/herdr-nav forwards the key so the editor moves between its own
# splits. Same split as the is_vim guard in tmux/.tmux.conf. Escaping nvim at
# its outermost window is the nvim half, in
# nvim/.config/nvim/lua/plugins/tmux-navigator.lua.
#
# As in tmux, this takes ctrl+k and ctrl+l away from zsh's kill-line and
# clear-screen inside herdr panes.

[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-nav h"
description = "Pane left (vim-aware)"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-nav j"
description = "Pane down (vim-aware)"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-nav k"
description = "Pane up (vim-aware)"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-nav l"
description = "Pane right (vim-aware)"

# --- 0-indexed tabs -----------------------------------------------------
# prefix+N focuses the tab at 0-based position N and bin/herdr-tab relabels
# tabs so the key matches the number drawn in the sidebar. Tabs you rename by
# hand keep their name and are skipped by the relabel.

[[keys.command]]
key = "prefix+c"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab new"
description = "New tab (0-indexed)"

[[keys.command]]
key = "prefix+&"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab close"
description = "Close tab (0-indexed)"

[[keys.command]]
key = "prefix+0"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 0"
description = "Tab 0"

[[keys.command]]
key = "prefix+1"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 1"
description = "Tab 1"

[[keys.command]]
key = "prefix+2"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 2"
description = "Tab 2"

[[keys.command]]
key = "prefix+3"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 3"
description = "Tab 3"

[[keys.command]]
key = "prefix+4"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 4"
description = "Tab 4"

[[keys.command]]
key = "prefix+5"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 5"
description = "Tab 5"

[[keys.command]]
key = "prefix+6"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 6"
description = "Tab 6"

[[keys.command]]
key = "prefix+7"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 7"
description = "Tab 7"

[[keys.command]]
key = "prefix+8"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 8"
description = "Tab 8"

[[keys.command]]
key = "prefix+9"
type = "shell"
command = "$HOME/.config/herdr/bin/herdr-tab focus 9"
description = "Tab 9"

[ui]
# bin/herdr-tab new goes through the socket API, which does not prompt.
prompt_new_tab_name = false
